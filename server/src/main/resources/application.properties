spring.application.name=commerza
server.port=${SERVER_PORT}
spring.datasource.url=${SERVER_DATASOURCE_URL}
spring.datasource.username={SERVER_DATASOURCE_USERNAME}
spring.datasource.password={SERVER_DATASOURCE_PASSWORD}

spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.shw-sql=true

razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}